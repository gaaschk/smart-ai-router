[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-ai-router"
version = "0.1.0"
description = "Vendor-agnostic LLM capability router with live provider sync"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage[toml]>=7.10,<8",
    "httpx",
    "openai>=3.29,<4",
    "openai-agents>=0.23,<1",
]

[project.scripts]
smart-ai-router = "smart_ai_router.__main__:main"
smart-ai-router-setup = "smart_ai_router.setup:run_setup"
smart-ai-router-review = "smart_ai_router.review:run_review_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["smart_ai_router", "scripts"]
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
# Baseline: 80.48% combined statement/branch coverage on af7d089.
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
