name: CI

# Pass/fail gate — runs on every push and PR.
# Deployment is pull-based: the running service checks for updates and applies
# them on demand via the UI (GET /api/updates, POST /api/updates/apply).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python }}
        run: uv venv --python "${{ matrix.python }}" .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          python -m coverage run -m pytest --junitxml=test-results.xml

      - name: Generate coverage reports
        if: always()
        run: |
          source .venv/bin/activate
          python -m coverage xml --fail-under=0
          python -m coverage json --fail-under=0
          python -m coverage html --fail-under=0
          python -m coverage report --fail-under=0 > coverage.txt
          {
            printf '### Python statement and branch coverage\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf '```text\n'
            cat coverage.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check measured coverage floor
        if: always()
        run: |
          source .venv/bin/activate
          python -m coverage report

      - name: Upload coverage and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}-${{ github.sha }}
          retention-days: 90
          path: |
            coverage.xml
            coverage.json
            coverage.txt
            htmlcov/
            test-results.xml

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install development and quality tools
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev,quality]"
      - name: Check fatal Python errors
        run: .venv/bin/ruff check smart_ai_router scripts tests --select E9,F63,F7,F82
      - name: Report formatting baseline
        continue-on-error: true
        run: .venv/bin/ruff format --check smart_ai_router scripts tests > formatting.txt
      - name: Report static security findings
        continue-on-error: true
        run: .venv/bin/bandit -r smart_ai_router -f json -o bandit.json
      - name: Audit installed dependencies
        continue-on-error: true
        run: .venv/bin/pip-audit --local --skip-editable --format json --output dependency-audit.json
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.sha }}
          path: |
            formatting.txt
            bandit.json
            dependency-audit.json
      - name: Explain report-only checks
        if: always()
        run: |
          printf '%s\n' '### Quality baseline' 'Fatal Python errors are gated. Formatting, Bandit and dependency audit are report-only until existing findings are triaged; successful CI does not mean these reports are clean. See the quality artifact and docs/quality.md. Missing reports or failed audit services require investigation.' >> "$GITHUB_STEP_SUMMARY"
