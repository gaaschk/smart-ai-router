name: CI

# Pass/fail gate — runs on every push and PR.
# Deployment is pull-based: the running service checks for updates and applies
# them on demand via the UI (GET /api/updates, POST /api/updates/apply).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv venv --python 3.12 .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          python -m coverage run -m pytest --junitxml=test-results.xml

      - name: Generate coverage reports
        if: always()
        run: |
          source .venv/bin/activate
          python -m coverage xml --fail-under=0
          python -m coverage json --fail-under=0
          python -m coverage html --fail-under=0
          python -m coverage report --fail-under=0 > coverage.txt
          {
            printf '### Python statement and branch coverage\n\n'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf '```text\n'
            cat coverage.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check measured coverage floor
        if: always()
        run: |
          source .venv/bin/activate
          python -m coverage report

      - name: Upload coverage and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          retention-days: 90
          path: |
            coverage.xml
            coverage.json
            coverage.txt
            htmlcov/
            test-results.xml
